# Configuration for creating balanced dataset splits
# Raw dataset containing Image and Mask subdirectories (or flat if configurable)
SOURCE_PATH: "/home/tsopermon/Documents/Thesis Research/Andros Dataset-20251220T140551Z-1-001/Andros Dataset/refined_dataset"
# Where the train, val, test subsets will be copied
OUTPUT_PATH: "/home/tsopermon/Documents/Thesis Research/Andros Dataset-20251220T140551Z-1-001/Andros Dataset/refined_dataset/balanced_dataset"

IMAGE_SUBDIR: image
# Set MASK_SUBDIR to null or leave empty if your dataset only contains images
MASK_SUBDIR: mask

SPLIT_RATIOS:
  train: 0.70
  val: 0.15
  test: 0.15

# Suffixes for filename matching (e.g. "_image", "_mask")
#IMAGE_SUFFIX:
#MASK_SUFFIX:

# Optional: String replacement in the middle of filenames
# (e.g. if mask is "..._Mask_001.tif" and image is "..._Image_001.tif")
REPLACE_MASK_STR:
WITH_IMAGE_STR:

# Optional: Set this to false to scan image by image if all masks aren't mapped
# Or you can let the script auto-detect all possible classes.
